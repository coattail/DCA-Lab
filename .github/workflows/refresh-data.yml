name: Refresh Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.github_pages_deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh localized datasets
        run: python backend/scripts/refresh_backtest_data.py

      # Deploy before pushing the refreshed files. Pushing first makes the
      # workflow's original commit stale and Pages rejects that deployment.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web

      - name: Deploy latest data to GitHub Pages
        id: github_pages_deployment
        uses: actions/deploy-pages@v5

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A web/data backend/cache
            git commit -m "chore: refresh market data"
            git push
          fi

      - name: Check Cloudflare deploy secrets
        id: cloudflare_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to Actions secrets to deploy refreshed data directly to Cloudflare Pages. Data refresh and GitHub Pages deploy can still complete without them."
          fi

      - name: Setup Node for Cloudflare deploy
        if: steps.cloudflare_deploy.outputs.has_secrets == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Deploy latest data to Cloudflare Pages
        if: steps.cloudflare_deploy.outputs.has_secrets == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy web --project-name=dcalab --branch=main --commit-dirty=true
